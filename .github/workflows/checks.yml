name: Candidate checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m compileall -q .
      - run: node --check app.js && node --check workspace.js
      - run: python rework/test_records.py
      - run: python rework/test_recursive_context.py

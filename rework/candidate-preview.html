<!doctype html><html lang="en"><meta charset="utf-8"><title>Logis candidate</title><style>body{background:#101822;color:#d4e4ee;font:16px system-ui;padding:30px}button,input,select{padding:10px;margin:8px;background:#203140;color:inherit}article{padding:18px;border:1px solid #405366;margin:10px}small{color:#9cc7c8}dialog{background:#14202c;color:#d4e4ee;border:1px solid #405366;border-radius:12px;max-width:min(680px,90vw);max-height:85vh;overflow:auto}dialog::backdrop{background:#0009}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere}blockquote{border-left:3px solid #70d5c5;padding-left:12px}</style><h1>Logis Â· Candidate workspace</h1><p>Isolated preview. Production is unchanged.</p><input id="token" type="password" aria-label="Access token"><button id="connect">Connect</button><select id="projects" aria-label="Project"></select><p id="status" role="status">Disconnected</p><button id="missions">Missions</button><button id="decisions">Decisions</button><button id="activity">Activity</button><button id="newRecord">New task / decision</button><div id="records"></div><div id="events" hidden></div><dialog id="sourceDialog"><button id="closeSource">Close source</button><div id="sourceContent"></div></dialog><script>
const $=id=>document.getElementById(id);let token='',project='',cursor=0,generation=0,busy=false,editing=false,recordKind='tasks';const seen=new Set();
async function api(path,options={}){let r=await fetch(path,{...options,headers:{Authorization:'Bearer '+token,...options.headers}});let data=await r.json();if(!r.ok)throw Error(r.status===409?'Record changed. Cancel and reopen before saving.':data.detail||'Request failed: '+r.status);return data}
async function records(g){if(editing)return;const requestedKind=recordKind;let rows=await api('/api/projects/'+encodeURIComponent(project)+'/objects');if(g!==generation||editing||requestedKind!==recordKind)return;$('records').replaceChildren();for(let x of rows.filter(x=>recordKind==='tasks'?['tasks','task'].includes(x.kind):['decisions','decision'].includes(x.kind))){let card=document.createElement('article');card.textContent=(x.payload.title||x.id)+' Â· '+x.status+' Â· version '+x.version;let edit=document.createElement('button');edit.textContent=recordKind==='tasks'?'Edit task':'Edit decision';edit.onclick=()=>openEditor(card,x);card.append(edit);const evidence=document.createElement('button');evidence.textContent='View evidence';evidence.onclick=()=>showEvidence(x.id);card.append(evidence);$('records').append(card)}if(!$('records').children.length)$('records').textContent='No records in this view.'}
function openEditor(card,item){if(editing)return;editing=true;$('projects').disabled=true;$('connect').disabled=true;let key=null;const g=generation,form=document.createElement('form'),title=document.createElement('input'),detail=document.createElement('textarea'),state=document.createElement('select'),save=document.createElement('button'),cancel=document.createElement('button'),error=document.createElement('p');title.value=item.payload.title||'';title.required=true;title.maxLength=180;title.setAttribute('aria-label',(recordKind==='tasks'?'Task':'Decision')+' title');detail.value=item.payload.detail||'';detail.maxLength=12000;detail.setAttribute('aria-label',(recordKind==='tasks'?'Task':'Decision')+' details');state.setAttribute('aria-label',(recordKind==='tasks'?'Task':'Decision')+' status');for(const value of (item.isNew?['draft','open']:['draft','open','in_progress','done','archived'])){let option=document.createElement('option');option.value=value;option.textContent=value;state.append(option)}state.value=item.status;save.type='submit';save.textContent=item.isNew?'Create record':'Save changes';cancel.type='button';cancel.textContent='Cancel edit';error.setAttribute('role','alert');function finish(){editing=false;$('projects').disabled=false;$('connect').disabled=false}cancel.onclick=()=>{finish();records(g).catch(e=>error.textContent=e.message)};form.oninput=()=>key=null;form.onsubmit=async event=>{event.preventDefault();save.disabled=true;key=key||crypto.randomUUID();try{await api('/api/projects/'+encodeURIComponent(project)+'/objects'+(item.isNew?'':'/'+encodeURIComponent(item.id)),{method:item.isNew?'POST':'PATCH',headers:{'Content-Type':'application/json','Idempotency-Key':key},body:JSON.stringify(item.isNew?{kind:recordKind,title:title.value,detail:detail.value,status:state.value}:{expected_version:item.version,title:title.value,detail:detail.value,status:state.value})});finish();await records(g);await poll()}catch(e){error.textContent=e.message}finally{save.disabled=false}};form.append(title,detail,state,save,cancel,error);card.append(form)}
async function showEvidence(id){const g=generation;$('sourceContent').replaceChildren();$('sourceDialog').showModal();try{const links=await api('/api/objects/'+encodeURIComponent(id)+'/evidence');if(g!==generation)return;for(const link of links){const row=document.createElement('article');const quote=document.createElement('blockquote');quote.textContent=link.quote;const note=document.createElement('p');note.textContent=(link.active?'Active evidence':'Source needs review')+' - revision '+link.source_revision;const open=document.createElement('button');open.textContent='Open source';open.onclick=async()=>{try{const source=await api('/api/sources/'+encodeURIComponent(link.source_id));if(g!==generation)return;const pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.textContent=source.payload.content||JSON.stringify(source.payload,null,2);row.append(pre);open.disabled=true}catch(e){note.textContent=e.message}};row.append(quote,note,open);$('sourceContent').append(row)}if(!links.length)$('sourceContent').textContent='No supporting source is linked to this record.'}catch(e){$('sourceContent').textContent=e.message}}
$('newRecord').onclick=()=>{if(editing||!project)return;$('records').hidden=false;$('events').hidden=true;const card=document.createElement('article');$('records').prepend(card);openEditor(card,{isNew:true,status:'draft',payload:{}})};
$('closeSource').onclick=()=>$('sourceDialog').close();
async function poll(){if(!token||!project||busy)return;busy=true;let g=generation;try{let page=await api('/api/events?project='+encodeURIComponent(project)+'&after='+cursor);if(g!==generation)return;for(let x of page.events){if(seen.has(x.event_id))continue;let row=document.createElement('article');row.textContent=x.event_type+' Â· '+x.object_id+' Â· version '+x.record_version;$('events').prepend(row);seen.add(x.event_id)}if(page.events.length)await records(g);if(g===generation){cursor=page.next_cursor;$('status').textContent='Connected Â· cursor '+cursor}}catch(e){if(g===generation)$('status').textContent=e.message}finally{busy=false}}
async function choose(){if($('sourceDialog').open)$('sourceDialog').close();generation++;project=$('projects').value;cursor=0;seen.clear();$('events').replaceChildren();$('records').replaceChildren();try{await records(generation);await poll()}catch(e){$('status').textContent=e.message}}
$('connect').onclick=async()=>{if($('sourceDialog').open)$('sourceDialog').close();generation++;token=$('token').value.trim();project='';$('records').replaceChildren();$('events').replaceChildren();$('projects').replaceChildren();try{let rows=await api('/api/projects');for(let x of rows){let o=document.createElement('option');o.value=x.id;o.textContent=x.name;$('projects').append(o)}if(rows.length)await choose();else $('status').textContent='No permitted projects'}catch(e){$('status').textContent=e.message}};
$('projects').onchange=choose;$('decisions').onclick=()=>{if(editing)return;recordKind='decisions';$('records').hidden=false;$('events').hidden=true;records(generation).catch(e=>$('status').textContent=e.message)};$('missions').onclick=()=>{if(editing)return;recordKind='tasks';records(generation).catch(e=>$('status').textContent=e.message);$('records').hidden=false;$('events').hidden=true};$('activity').onclick=()=>{$('records').hidden=true;$('events').hidden=false};setInterval(poll,2000);
</script></html>
